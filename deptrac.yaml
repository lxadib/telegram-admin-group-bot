deptrac:
  paths:
    - ./contracts/src
    - ./kernel/src
    - ./adapters/src
    - ./apps
  exclude_files:
    - '#.*test.*#'
  layers:
    - name: Contracts
      collectors:
        - type: classLike
          value: Platform\\Contracts\\.*
    - name: Kernel
      collectors:
        - type: classLike
          value: Platform\\Kernel\\.*
    - name: Adapters
      collectors:
        - type: classLike
          value: Platform\\Adapters\\.*
    - name: Apps
      collectors:
        - type: classLike
          value: Platform\\Apps\\.*
  ruleset:
    Contracts: ~
    Kernel:
      - Contracts
    Adapters:
      - Contracts
    Apps:
      - Kernel
      - Contracts
      - Adapters
